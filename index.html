<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riepilogo ASTE</title>
<style>
  :root{
    --ink:#1B2545; --ink-soft:#3B4368; --paper:#F6F5FB; --card:#FFFFFF; --line:#E1DFEE;
    --gold:#A9791F; --gold-soft:#F1E6C8; --alert:#A6402C; --alert-soft:#F5E1DC;
    --ok:#2F6B4F; --ok-soft:#DCEAE1;
    --shadow: 0 1px 2px rgba(27,37,69,0.06), 0 8px 24px rgba(27,37,69,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);}
  h1,h2,h3{font-family:'Fraunces','Georgia',serif;margin:0;}
  .aste-app{padding:28px 20px 60px;max-width:1200px;margin:0 auto;min-height:100vh;}

  /* --- auth screen --- */
  .aa-auth-wrap{max-width:380px;margin:80px auto;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);}
  .aa-auth-wrap h1{font-size:26px;margin-bottom:6px;}
  .aa-auth-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}
  .aa-auth-field{margin-bottom:14px;}
  .aa-auth-field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .aa-auth-field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;}
  .aa-auth-msg{font-size:12.5px;margin:10px 0;min-height:16px;}
  .aa-auth-msg.err{color:var(--alert);}
  .aa-auth-msg.ok{color:var(--ok);}
  .aa-auth-switch{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;}
  .aa-auth-switch a{color:var(--gold);cursor:pointer;text-decoration:underline;}

  .aa-header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:24px;}
  .aa-header h1{font-size:32px;font-weight:700;letter-spacing:-0.01em;}
  .aa-sub{font-size:13px;color:var(--ink-soft);letter-spacing:0.04em;text-transform:uppercase;margin-top:4px;}
  .aa-header-right{display:flex;align-items:center;gap:12px;}
  .aa-count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:6px 14px;white-space:nowrap;}
  .aa-user-chip{font-size:12px;color:var(--ink-soft);}
  .aa-user-chip button{background:none;border:none;color:var(--alert);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;margin-left:8px;}

  .aa-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .aa-btn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;border:1px solid var(--ink);
    background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;}
  .aa-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .aa-btn.secondary{background:transparent;color:var(--ink);}
  .aa-btn.gold{background:var(--gold);border-color:var(--gold);}
  .aa-btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .aa-btn.full{width:100%;justify-content:center;}
  .aa-btn:disabled{opacity:0.55;cursor:progress;}
  .aa-btn svg{width:15px;height:15px;flex:none;}

  .aa-footer-note{text-align:center;color:var(--ink-soft);font-size:11.5px;margin:0 0 20px;}

  .aa-empty{border:1.5px dashed var(--line);border-radius:14px;padding:48px 24px;text-align:center;color:var(--ink-soft);}
  .aa-empty h3{font-size:20px;margin-bottom:8px;color:var(--ink);}

  .aa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .aa-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .aa-card-top{background:var(--ink);color:#fff;padding:16px 18px 14px;position:relative;}
  .aa-card-loc{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1.15;padding-right:70px;}
  .aa-card-ref{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:0.75;margin-top:4px;letter-spacing:0.03em;}
  .aa-card-region{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:0.75;margin-top:2px;letter-spacing:0.03em;}

  .aa-filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow);}
  .aa-filter-field{display:flex;flex-direction:column;gap:5px;min-width:170px;}
  .aa-filter-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}
  .aa-filter-field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);background:#fff;}
  .aa-filters .aa-btn.ghost{padding:8px 14px;}
  .aa-stamp{position:absolute;top:12px;right:12px;border:2px solid var(--gold-soft);color:var(--gold-soft);
    border-radius:50%;width:58px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;transform:rotate(6deg);line-height:1;}
  .aa-stamp b{font-size:18px;}
  .aa-stamp span{font-size:8px;letter-spacing:0.05em;text-transform:uppercase;margin-top:2px;}
  .aa-stamp.urgent{border-color:#f0b8ab;color:#f6d2c6;}
  .aa-stamp.past{border-color:#8892b8;color:#8892b8;}

  .aa-rows{padding:4px 18px;flex:1;}
  .aa-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .aa-row:last-child{border-bottom:none;}
  .aa-row .k{color:var(--ink-soft);}
  .aa-row .v{font-weight:600;text-align:right;}
  .aa-row .v.money{font-family:'IBM Plex Mono',monospace;color:var(--gold);}

  .aa-status-bar{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .aa-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;}
  .aa-badge.st-valutare{background:var(--gold-soft);color:var(--gold);}
  .aa-badge.st-confermata{background:#E0E6F5;color:#33447A;}
  .aa-badge.st-partecipato{background:#E5E0F5;color:#5A3D9E;}
  .aa-badge.st-vinto{background:var(--ok-soft);color:var(--ok);}
  .aa-badge.st-perso{background:var(--alert-soft);color:var(--alert);}

  .aa-card-actions{display:flex;gap:6px;}
  .aa-icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;border-radius:6px;}
  .aa-icon-btn:hover{color:var(--ink);background:var(--paper);}
  .aa-icon-btn svg{width:16px;height:16px;}

  .aa-note{padding:0 18px 14px;font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .aa-link{padding:0 18px 14px;}
  .aa-link a{font-size:12px;color:var(--gold);text-decoration:none;word-break:break-all;}

  .aa-overlay{position:fixed;inset:0;background:rgba(27,37,69,0.5);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow:auto;z-index:9999;}
  .aa-modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;box-shadow:var(--shadow);}
  .aa-modal-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .aa-modal-head h2{font-size:22px;}
  .aa-modal-body{padding:22px 26px;}
  .aa-modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  .aa-extract-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .aa-extract-box{flex:1;min-width:220px;border:1.5px dashed var(--line);border-radius:10px;padding:12px;}
  .aa-extract-box label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);display:block;margin-bottom:8px;}
  .aa-extract-box input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:8px;}
  .aa-status-msg{font-size:12px;margin-top:6px;color:var(--ink-soft);min-height:16px;}
  .aa-status-msg.err{color:var(--alert);}
  .aa-status-msg.ok{color:var(--ok);}

  .aa-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .aa-field{display:flex;flex-direction:column;gap:5px;}
  .aa-field.full{grid-column:1/-1;}
  .aa-field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}
  .aa-field input,.aa-field select,.aa-field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);}
  .aa-field textarea{resize:vertical;min-height:60px;}

  .aa-hint{background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#5c4715;margin-bottom:16px;}
  .aa-hint code{background:rgba(255,255,255,.6);padding:1px 5px;border-radius:4px;}

  @media (max-width:480px){ .aa-form-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="aste-app" id="asteApp"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){

  // =========================================================================
  // CONFIGURAZIONE — incolla qui i valori del tuo progetto Supabase
  // (Project Settings > API, nella dashboard di supabase.com)
  // =========================================================================
  const SUPABASE_URL = "https://ocndrejzhxtvxrrarufk.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_0iVjD1sJBtAXvMxaVmcOfA_zttgL7Gd";
  // =========================================================================

  const root = document.getElementById('asteApp');

  if(SUPABASE_URL.indexOf('INCOLLA_QUI')===0 || SUPABASE_ANON_KEY.indexOf('INCOLLA_QUI')===0){
    root.innerHTML = `
      <div class="aa-auth-wrap">
        <h1>Configurazione mancante</h1>
        <div class="aa-auth-sub">Apri il file index.html e inserisci SUPABASE_URL e SUPABASE_ANON_KEY in cima allo script, seguendo le istruzioni nel README.</div>
      </div>`;
    return;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const FIELD_DEFS = [
    {k:'localita', label:'Località', full:true, placeholder:'Es. Ferrara (FE), Via Roma 12'},
    {k:'regione', label:'Regione', placeholder:'Es. Emilia-Romagna'},
    {k:'provincia', label:'Provincia', placeholder:'Es. Ferrara'},
    {k:'riferimento', label:'N. Riferimento'},
    {k:'dataAnnuncio', label:'Data Annuncio', type:'date'},
    {k:'tipologia', label:'Tipologia'},
    {k:'custode', label:'Custode'},
    {k:'delegato', label:'Delegato'},
    {k:'giudice', label:'Giudice'},
    {k:'superficie', label:'Superficie (mq)'},
    {k:'efficienza', label:'Efficienza energetica'},
    {k:'dataAsta', label:'Data e ora Asta', type:'datetime-local'},
    {k:'tribunale', label:'Tribunale'},
    {k:'procedura', label:'N. Procedura'},
    {k:'prezzoMinimo', label:'Prezzo offerta minima (€)'},
    {k:'tipologiaAsta', label:"Tipologia d'asta"},
    {k:'offertaPrevista', label:'Offerta che vuoi fare (€)'},
    {k:'risparmio', label:'Risparmio (€)', placeholder:'Calcolato da Quotazione − Prezzo minimo'},
    {k:'quotazione', label:'Quotazione di mercato (€)'},
    {k:'link', label:'Link annuncio', full:true},
    {k:'note', label:'Note personali', full:true, type:'textarea'},
  ];
  const STATUS_OPTIONS = [
    {v:'valutare', label:'Da valutare', cls:'st-valutare'},
    {v:'confermata', label:'Partecipazione confermata', cls:'st-confermata'},
    {v:'partecipato', label:'Partecipato', cls:'st-partecipato'},
    {v:'vinto', label:'Aggiudicato', cls:'st-vinto'},
    {v:'perso', label:'Non aggiudicato', cls:'st-perso'},
  ];
  const CAMEL_TO_DB = {
    localita:'localita', regione:'regione', provincia:'provincia', riferimento:'riferimento', dataAnnuncio:'data_annuncio', tipologia:'tipologia',
    custode:'custode', delegato:'delegato', giudice:'giudice',
    superficie:'superficie', efficienza:'efficienza', dataAsta:'data_asta', tribunale:'tribunale',
    procedura:'procedura', prezzoMinimo:'prezzo_minimo', tipologiaAsta:'tipologia_asta',
    offertaPrevista:'offerta_prevista', risparmio:'risparmio', quotazione:'quotazione',
    link:'link', note:'note', stato:'stato'
  };
  const DB_TO_CAMEL = Object.fromEntries(Object.entries(CAMEL_TO_DB).map(([a,b])=>[b,a]));

  function escapeHtml(str){
    if(str===undefined||str===null) return '';
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function statusMeta(v){ return STATUS_OPTIONS.find(s=>s.v===v) || STATUS_OPTIONS[0]; }
  function daysUntil(dateStr){
    if(!dateStr) return null;
    const t = new Date(dateStr); if(isNaN(t.getTime())) return null;
    return Math.ceil((t-new Date())/(1000*60*60*24));
  }
  function fmtDateTime(dateStr){
    if(!dateStr) return '—';
    const d = new Date(dateStr); if(isNaN(d.getTime())) return dateStr;
    return d.toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
  }
  function toDbRow(obj, userId){
    const row = {user_id:userId};
    Object.keys(CAMEL_TO_DB).forEach(k=>{ row[CAMEL_TO_DB[k]] = obj[k] || null; });
    if(row.data_annuncio==='') row.data_annuncio=null;
    if(row.data_asta==='') row.data_asta=null;
    return row;
  }
  function fromDbRow(row){
    const obj = {id:row.id};
    Object.keys(DB_TO_CAMEL).forEach(dbk=>{ obj[DB_TO_CAMEL[dbk]] = row[dbk]; });
    return obj;
  }

  let currentUser = null;
  let properties = [];
  let sortBy = 'scadenza';       // scadenza | prezzo_asc | prezzo_desc | risparmio
  let filterRegione = '';
  let filterProvincia = '';

  // ---------------- AUTH ----------------
  function renderAuth(mode, prefillEmail){
    mode = mode || 'login';

    if(mode==='recover-request'){
      root.innerHTML = `
        <div class="aa-auth-wrap">
          <h1>Recupera password</h1>
          <div class="aa-auth-sub">Ti invieremo un codice di verifica via email</div>
          <div class="aa-auth-field"><label>Email</label><input type="email" id="recEmail" autocomplete="email" value="${escapeHtml(prefillEmail||'')}" /></div>
          <div class="aa-auth-msg" id="recMsg"></div>
          <button class="aa-btn full" id="recSend">Invia codice</button>
          <div class="aa-auth-switch"><a id="backToLogin">Torna al login</a></div>
        </div>`;
      document.getElementById('backToLogin').addEventListener('click', ()=>renderAuth('login'));
      document.getElementById('recSend').addEventListener('click', async ()=>{
        const email = document.getElementById('recEmail').value.trim();
        const msg = document.getElementById('recMsg');
        if(!email){ msg.className='aa-auth-msg err'; msg.textContent='Inserisci la tua email.'; return; }
        msg.className='aa-auth-msg'; msg.textContent='Invio in corso...';
        const {error} = await supabase.auth.resetPasswordForEmail(email);
        if(error){ msg.className='aa-auth-msg err'; msg.textContent=error.message; return; }
        renderAuth('recover-verify', email);
      });
      return;
    }

    if(mode==='recover-verify'){
      root.innerHTML = `
        <div class="aa-auth-wrap">
          <h1>Inserisci il codice</h1>
          <div class="aa-auth-sub">Controlla la casella ${escapeHtml(prefillEmail||'')} e inserisci il codice a 6 cifre ricevuto, insieme alla nuova password</div>
          <div class="aa-auth-field"><label>Codice di verifica</label><input type="text" id="recCode" inputmode="numeric" maxlength="6" placeholder="123456" /></div>
          <div class="aa-auth-field"><label>Nuova password</label><input type="password" id="recNewPass" autocomplete="new-password" /></div>
          <div class="aa-auth-msg" id="recMsg2"></div>
          <button class="aa-btn full" id="recConfirm">Imposta nuova password</button>
          <div class="aa-auth-switch"><a id="resendCode">Non hai ricevuto il codice? Rinvia</a></div>
        </div>`;
      document.getElementById('resendCode').addEventListener('click', ()=>renderAuth('recover-request', prefillEmail));
      document.getElementById('recConfirm').addEventListener('click', async ()=>{
        const code = document.getElementById('recCode').value.trim();
        const newPass = document.getElementById('recNewPass').value;
        const msg = document.getElementById('recMsg2');
        if(!code || !newPass){ msg.className='aa-auth-msg err'; msg.textContent='Inserisci codice e nuova password.'; return; }
        msg.className='aa-auth-msg'; msg.textContent='Verifica in corso...';
        try{
          const {error: verifyErr} = await supabase.auth.verifyOtp({email: prefillEmail, token: code, type: 'recovery'});
          if(verifyErr) throw verifyErr;
          const {error: updErr} = await supabase.auth.updateUser({password: newPass});
          if(updErr) throw updErr;
          msg.className='aa-auth-msg ok';
          msg.textContent='Password aggiornata, accesso in corso...';
        }catch(err){
          msg.className='aa-auth-msg err';
          msg.textContent = err.message || 'Codice non valido o scaduto.';
        }
      });
      return;
    }

    root.innerHTML = `
      <div class="aa-auth-wrap">
        <h1>Riepilogo ASTE</h1>
        <div class="aa-auth-sub">${mode==='login' ? 'Accedi al tuo archivio personale' : 'Crea il tuo account gratuito'}</div>
        <div class="aa-auth-field"><label>Email</label><input type="email" id="authEmail" autocomplete="email" /></div>
        <div class="aa-auth-field"><label>Password</label><input type="password" id="authPass" autocomplete="${mode==='login'?'current-password':'new-password'}" /></div>
        <div class="aa-auth-msg" id="authMsg"></div>
        <button class="aa-btn full" id="authSubmit">${mode==='login' ? 'Accedi' : 'Registrati'}</button>
        <div class="aa-auth-switch">
          ${mode==='login'
            ? `Non hai un account? <a id="authSwitch">Registrati</a> &nbsp;·&nbsp; <a id="forgotPass">Password dimenticata?</a>`
            : `Hai già un account? <a id="authSwitch">Accedi</a>`}
        </div>
      </div>`;

    document.getElementById('authSwitch').addEventListener('click', ()=>renderAuth(mode==='login'?'signup':'login'));
    const forgot = document.getElementById('forgotPass');
    if(forgot) forgot.addEventListener('click', ()=>renderAuth('recover-request'));
    document.getElementById('authSubmit').addEventListener('click', async ()=>{
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value;
      const msg = document.getElementById('authMsg');
      if(!email || !pass){ msg.className='aa-auth-msg err'; msg.textContent='Inserisci email e password.'; return; }
      msg.className='aa-auth-msg'; msg.textContent='Attendere...';
      try{
        if(mode==='login'){
          const {error} = await supabase.auth.signInWithPassword({email, password:pass});
          if(error) throw error;
        }else{
          const {error} = await supabase.auth.signUp({email, password:pass});
          if(error) throw error;
          msg.className='aa-auth-msg ok';
          msg.textContent='Account creato. Se richiesto, controlla la tua email per confermare, poi accedi.';
          return;
        }
      }catch(err){
        msg.className='aa-auth-msg err';
        msg.textContent = err.message || 'Errore di autenticazione.';
      }
    });
  }

  // ---------------- APP ----------------
  async function renderApp(){
    root.innerHTML = `
      <div class="aa-header">
        <div>
          <h1>Riepilogo ASTE</h1>
          <div class="aa-sub">Monitoraggio immobili in procedura esecutiva</div>
        </div>
        <div class="aa-header-right">
          <div class="aa-count" id="aaCount">0 immobili in archivio</div>
          <div class="aa-user-chip">${escapeHtml(currentUser.email)}<button id="aaLogout">Esci</button></div>
        </div>
      </div>
      <div class="aa-actions">
        <button class="aa-btn" id="btnNew">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nuovo immobile
        </button>
        <button class="aa-btn gold" id="btnPdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
          Esporta riepilogo PDF
        </button>
      </div>
      <div class="aa-footer-note" style="text-align:left;">Genera un file PDF orizzontale (A4) con la tabella riassuntiva di tutti gli immobili.</div>
      <div class="aa-filters" id="aaFilters"></div>
      <div id="aaGridWrap"></div>
      <div id="aaOverlayHost"></div>
    `;
    document.getElementById('aaLogout').addEventListener('click', async ()=>{ await supabase.auth.signOut(); });
    document.getElementById('btnNew').addEventListener('click', ()=>openForm(null));
    document.getElementById('btnPdf').addEventListener('click', exportPdf);

    await loadProperties();
  }

  async function loadProperties(){
    const {data, error} = await supabase.from('properties').select('*').eq('user_id', currentUser.id);
    if(error){ alert('Errore nel caricamento dati: '+error.message); properties=[]; }
    else{ properties = data.map(fromDbRow); }
    renderGrid();
  }

  function uniqueSorted(arr){
    return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
  }
  function toNum(v){
    const n = parseFloat(String(v||'').replace(/\./g,'').replace(',','.'));
    return isNaN(n) ? null : n;
  }

  function renderFilters(){
    const bar = document.getElementById('aaFilters');
    if(!bar) return;
    if(properties.length===0){ bar.innerHTML=''; return; }
    const regioni = uniqueSorted(properties.map(p=>p.regione));
    const province = uniqueSorted(properties.map(p=>p.provincia));
    const hasActive = sortBy!=='scadenza' || filterRegione || filterProvincia;
    bar.innerHTML = `
      <div class="aa-filter-field">
        <label>Ordina per</label>
        <select id="filterSort">
          <option value="scadenza" ${sortBy==='scadenza'?'selected':''}>Data scadenza (più vicina)</option>
          <option value="prezzo_asc" ${sortBy==='prezzo_asc'?'selected':''}>Prezzo più basso</option>
          <option value="prezzo_desc" ${sortBy==='prezzo_desc'?'selected':''}>Prezzo più alto</option>
          <option value="risparmio" ${sortBy==='risparmio'?'selected':''}>Maggior risparmio</option>
        </select>
      </div>
      <div class="aa-filter-field">
        <label>Regione</label>
        <select id="filterRegione">
          <option value="">Tutte</option>
          ${regioni.map(r=>`<option value="${escapeHtml(r)}" ${filterRegione===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
        </select>
      </div>
      <div class="aa-filter-field">
        <label>Provincia</label>
        <select id="filterProvincia">
          <option value="">Tutte</option>
          ${province.map(pr=>`<option value="${escapeHtml(pr)}" ${filterProvincia===pr?'selected':''}>${escapeHtml(pr)}</option>`).join('')}
        </select>
      </div>
      ${hasActive?'<button class="aa-btn ghost" id="filterReset" type="button">Azzera filtri</button>':''}
    `;
    document.getElementById('filterSort').addEventListener('change', e=>{ sortBy=e.target.value; renderGrid(); });
    document.getElementById('filterRegione').addEventListener('change', e=>{ filterRegione=e.target.value; renderGrid(); });
    document.getElementById('filterProvincia').addEventListener('change', e=>{ filterProvincia=e.target.value; renderGrid(); });
    const resetBtn = document.getElementById('filterReset');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{ sortBy='scadenza'; filterRegione=''; filterProvincia=''; renderGrid(); });
  }

  function renderGrid(){
    const gridWrap = document.getElementById('aaGridWrap');
    const countEl = document.getElementById('aaCount');
    renderFilters();

    if(properties.length===0){
      countEl.textContent = '0 immobili in archivio';
      gridWrap.innerHTML = `<div class="aa-empty"><h3>Nessun immobile ancora</h3>
        <div>Aggiungi un fascicolo manualmente, da una foto dell'annuncio, o incollando un link.</div></div>`;
      return;
    }

    const filtered = properties.filter(p=>{
      if(filterRegione && p.regione!==filterRegione) return false;
      if(filterProvincia && p.provincia!==filterProvincia) return false;
      return true;
    });

    countEl.textContent = filtered.length + (filtered.length===1 ? ' immobile in archivio' : ' immobili in archivio');

    if(filtered.length===0){
      gridWrap.innerHTML = `<div class="aa-empty"><h3>Nessun risultato</h3>
        <div>Nessun immobile corrisponde ai filtri selezionati.</div></div>`;
      return;
    }

    const sorted = [...filtered].sort((a,b)=>{
      if(sortBy==='prezzo_asc' || sortBy==='prezzo_desc'){
        const va = toNum(a.prezzoMinimo), vb = toNum(b.prezzoMinimo);
        const xa = va===null?Infinity:va, xb = vb===null?Infinity:vb;
        return sortBy==='prezzo_asc' ? xa-xb : xb-xa;
      }
      if(sortBy==='risparmio'){
        const va = toNum(a.risparmio), vb = toNum(b.risparmio);
        const xa = va===null?-Infinity:va, xb = vb===null?-Infinity:vb;
        return xb-xa;
      }
      const da = a.dataAsta ? new Date(a.dataAsta).getTime() : Infinity;
      const db = b.dataAsta ? new Date(b.dataAsta).getTime() : Infinity;
      return da-db;
    });
    gridWrap.innerHTML = `<div class="aa-grid">${sorted.map(cardHtml).join('')}</div>`;
    gridWrap.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click', ()=>openForm(btn.getAttribute('data-edit'))));
    gridWrap.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', ()=>confirmDelete(btn.getAttribute('data-del'))));
  }

  function cardHtml(p){
    const days = daysUntil(p.dataAsta);
    let stampCls='', stampBig='—', stampSmall='giorni';
    if(days!==null){
      if(days<0){ stampCls='past'; stampBig='0'; stampSmall='passata'; }
      else{ stampBig=days; stampSmall = days===1?'giorno':'giorni'; if(days<=7) stampCls='urgent'; }
    }
    const st = statusMeta(p.stato);
    return `
    <div class="aa-card">
      <div class="aa-card-top">
        <div class="aa-card-loc">${escapeHtml(p.localita)||'Località non indicata'}</div>
        <div class="aa-card-ref">Rif. ${escapeHtml(p.riferimento)||'—'} · Proc. ${escapeHtml(p.procedura)||'—'}</div>
        ${p.regione?`<div class="aa-card-region">${escapeHtml(p.regione)}${p.provincia?' ('+escapeHtml(p.provincia)+')':''}</div>`:''}
        <div class="aa-stamp ${stampCls}"><b>${stampBig}</b><span>${stampSmall}</span></div>
      </div>
      <div class="aa-rows">
        <div class="aa-row"><span class="k">Tipologia</span><span class="v">${escapeHtml(p.tipologia)||'—'}</span></div>
        ${p.custode?`<div class="aa-row"><span class="k">Custode</span><span class="v">${escapeHtml(p.custode)}</span></div>`:''}
        ${p.delegato?`<div class="aa-row"><span class="k">Delegato</span><span class="v">${escapeHtml(p.delegato)}</span></div>`:''}
        ${p.giudice?`<div class="aa-row"><span class="k">Giudice</span><span class="v">${escapeHtml(p.giudice)}</span></div>`:''}
        <div class="aa-row"><span class="k">Superficie</span><span class="v">${p.superficie?escapeHtml(p.superficie)+' mq':'—'}</span></div>
        <div class="aa-row"><span class="k">Efficienza en.</span><span class="v">${escapeHtml(p.efficienza)||'—'}</span></div>
        <div class="aa-row"><span class="k">Data asta</span><span class="v">${fmtDateTime(p.dataAsta)}</span></div>
        <div class="aa-row"><span class="k">Tribunale</span><span class="v">${escapeHtml(p.tribunale)||'—'}</span></div>
        <div class="aa-row"><span class="k">Tipologia d'asta</span><span class="v">${escapeHtml(p.tipologiaAsta)||'—'}</span></div>
        <div class="aa-row"><span class="k">Offerta minima</span><span class="v money">${p.prezzoMinimo?'€ '+escapeHtml(p.prezzoMinimo):'—'}</span></div>
        ${p.offertaPrevista?`<div class="aa-row"><span class="k">Tua offerta prevista</span><span class="v money">€ ${escapeHtml(p.offertaPrevista)}</span></div>`:''}
        ${p.risparmio?`<div class="aa-row"><span class="k">Risparmio</span><span class="v money">€ ${escapeHtml(p.risparmio)}</span></div>`:''}
        ${p.quotazione?`<div class="aa-row"><span class="k">Quotazione di mercato</span><span class="v money">€ ${escapeHtml(p.quotazione)}</span></div>`:''}
      </div>
      ${p.note?`<div class="aa-note">${escapeHtml(p.note)}</div>`:''}
      ${p.link?`<div class="aa-link"><a href="${escapeHtml(p.link)}" target="_blank" rel="noopener">${escapeHtml(p.link)}</a></div>`:''}
      <div class="aa-status-bar">
        <span class="aa-badge ${st.cls}">${st.label}</span>
        <div class="aa-card-actions">
          <button class="aa-icon-btn" data-edit="${p.id}" title="Modifica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
          <button class="aa-icon-btn" data-del="${p.id}" title="Elimina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg></button>
        </div>
      </div>
    </div>`;
  }

  function overlayHost(){ return document.getElementById('aaOverlayHost'); }
  function closeOverlay(){ overlayHost().innerHTML=''; }

  function confirmDelete(id){
    const p = properties.find(x=>x.id===id);
    if(!p) return;
    overlayHost().innerHTML = `
      <div class="aa-overlay"><div class="aa-modal" style="max-width:420px;">
        <div class="aa-modal-head"><h2 style="font-size:19px;">Eliminare l'immobile?</h2>
          <button class="aa-icon-btn" id="delClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
        <div class="aa-modal-body"><p style="margin:0;font-size:14px;color:var(--ink-soft);">
          Stai per eliminare <strong style="color:var(--ink);">${escapeHtml(p.localita)||'questo immobile'}</strong> dall'archivio. Non si può annullare.</p></div>
        <div class="aa-modal-foot">
          <button class="aa-btn ghost" id="delCancel">Annulla</button>
          <button class="aa-btn" style="background:var(--alert);border-color:var(--alert);" id="delConfirm">Elimina definitivamente</button>
        </div>
      </div></div>`;
    document.getElementById('delClose').addEventListener('click', closeOverlay);
    document.getElementById('delCancel').addEventListener('click', closeOverlay);
    document.getElementById('delConfirm').addEventListener('click', async ()=>{
      const {error} = await supabase.from('properties').delete().eq('id', id).eq('user_id', currentUser.id);
      if(error){ alert('Errore eliminazione: '+error.message); return; }
      closeOverlay();
      await loadProperties();
    });
  }

  function openForm(id){
    const existing = id ? properties.find(p=>p.id===id) : null;
    const data = existing ? {...existing} : {stato:'valutare'};
    overlayHost().innerHTML = `
      <div class="aa-overlay"><div class="aa-modal">
        <div class="aa-modal-head"><h2>${existing?'Modifica immobile':'Nuovo immobile'}</h2>
          <button class="aa-icon-btn" id="formClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
        <div class="aa-modal-body">
          ${existing?'':`
          <div class="aa-extract-row">
            <div class="aa-extract-box"><label>Compila da foto dell'annuncio</label>
              <input type="file" id="photoInput" accept="image/*" />
              <div class="aa-status-msg" id="photoMsg"></div></div>
            <div class="aa-extract-box"><label>Compila da link annuncio</label>
              <input type="text" id="linkInput" placeholder="https://..." />
              <button class="aa-btn secondary full" id="linkGo">Estrai dati dal link</button>
              <div class="aa-status-msg" id="linkMsg"></div></div>
          </div>`}
          <div class="aa-form-grid" id="formGrid"></div>
        </div>
        <div class="aa-modal-foot">
          <button class="aa-btn ghost" id="formCancel">Annulla</button>
          <button class="aa-btn" id="formSave">Salva immobile</button>
        </div>
      </div></div>`;

    const grid = document.getElementById('formGrid');
    grid.innerHTML = FIELD_DEFS.map(f=>{
      const val = escapeHtml(data[f.k]||'');
      if(f.type==='textarea') return `<div class="aa-field ${f.full?'full':''}"><label>${f.label}</label><textarea data-field="${f.k}">${val}</textarea></div>`;
      return `<div class="aa-field ${f.full?'full':''}"><label>${f.label}</label><input type="${f.type||'text'}" data-field="${f.k}" value="${val}" placeholder="${f.placeholder||''}"/></div>`;
    }).join('') + `<div class="aa-field"><label>Stato partecipazione</label>
      <select data-field="stato">${STATUS_OPTIONS.map(s=>`<option value="${s.v}" ${data.stato===s.v?'selected':''}>${s.label}</option>`).join('')}</select></div>`;

    document.getElementById('formClose').addEventListener('click', closeOverlay);
    document.getElementById('formCancel').addEventListener('click', closeOverlay);
    document.getElementById('formSave').addEventListener('click', ()=>saveForm(existing?existing.id:null));
    const photoInput = document.getElementById('photoInput');
    if(photoInput) photoInput.addEventListener('change', handlePhotoExtract);
    const linkGo = document.getElementById('linkGo');
    if(linkGo) linkGo.addEventListener('click', handleLinkExtract);

    // Calcolo automatico del Risparmio = Quotazione di mercato - Prezzo offerta minima
    const prezzoEl = document.querySelector('[data-field="prezzoMinimo"]');
    const quotEl = document.querySelector('[data-field="quotazione"]');
    const risEl = document.querySelector('[data-field="risparmio"]');
    function recalcRisparmio(){
      const pm = parseFloat(String(prezzoEl.value||'').replace(/\./g,'').replace(',','.'));
      const q = parseFloat(String(quotEl.value||'').replace(/\./g,'').replace(',','.'));
      if(!isNaN(pm) && !isNaN(q)) risEl.value = Math.round(q - pm);
    }
    if(prezzoEl && quotEl && risEl){
      prezzoEl.addEventListener('input', recalcRisparmio);
      quotEl.addEventListener('input', recalcRisparmio);
    }
  }

  async function saveForm(existingId){
    const obj = {};
    document.querySelectorAll('[data-field]').forEach(el=>{ obj[el.getAttribute('data-field')] = el.value; });
    const row = toDbRow(obj, currentUser.id);
    let error;
    if(existingId){
      ({error} = await supabase.from('properties').update(row).eq('id', existingId).eq('user_id', currentUser.id));
    }else{
      ({error} = await supabase.from('properties').insert(row));
    }
    if(error){ alert('Errore salvataggio: '+error.message); return; }
    closeOverlay();
    await loadProperties();
  }

  // ---------------- Estrazione AI (via funzione server, chiave nascosta anche al proprietario del sito) ----------------
  async function callExtractFunction(payload){
    const {data, error} = await supabase.functions.invoke('extract-property', { body: payload });
    if(error) throw new Error(error.message || 'Errore nella funzione di estrazione.');
    if(data && data.error) throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
    const content = (data && data.content) || [];
    return content.filter(b=>b.type==='text').map(b=>b.text).join('\\n');
  }

  function tryParseJson(text){
    if(!text) return null;
    let cleaned = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const s = cleaned.indexOf('{'), e = cleaned.lastIndexOf('}');
    if(s===-1||e===-1) return null;
    try{ return JSON.parse(cleaned.slice(s,e+1)); }catch(err){ return null; }
  }
  function fillFormFromExtracted(obj){
    if(!obj) return;
    Object.keys(obj).forEach(k=>{
      const el = document.querySelector(`[data-field="${k}"]`);
      if(el && obj[k]) el.value = obj[k];
    });
  }
  function fileToBase64(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload=()=>resolve(r.result.split(',')[1]);
      r.onerror=()=>reject(new Error('Lettura file fallita'));
      r.readAsDataURL(file);
    });
  }

  async function handlePhotoExtract(e){
    const file = e.target.files[0];
    const msg = document.getElementById('photoMsg');
    if(!file) return;
    msg.className='aa-status-msg'; msg.textContent='Lettura immagine in corso...';
    try{
      const base64 = await fileToBase64(file);
      const text = await callExtractFunction({mode:'photo', imageBase64: base64, imageMediaType: file.type||'image/jpeg'});
      const parsed = tryParseJson(text);
      if(parsed){ fillFormFromExtracted(parsed); msg.className='aa-status-msg ok'; msg.textContent='Dati inseriti. Controllali prima di salvare.'; }
      else{ msg.className='aa-status-msg err'; msg.textContent='Non sono riuscito a leggere i dati. Inseriscili manualmente.'; }
    }catch(err){ msg.className='aa-status-msg err'; msg.textContent='Errore: '+err.message; }
  }

  async function handleLinkExtract(){
    const input = document.getElementById('linkInput');
    const msg = document.getElementById('linkMsg');
    const url = input.value.trim();
    if(!url){ msg.className='aa-status-msg err'; msg.textContent='Incolla prima un link.'; return; }
    msg.className='aa-status-msg'; msg.textContent='Ricerca in corso...';
    const btn = document.getElementById('linkGo'); btn.disabled=true;
    try{
      const text = await callExtractFunction({mode:'link', url});
      const parsed = tryParseJson(text);
      if(parsed){
        fillFormFromExtracted(parsed);
        const linkField = document.querySelector('[data-field="link"]');
        if(linkField && !linkField.value) linkField.value = url;
        msg.className='aa-status-msg ok'; msg.textContent='Dati inseriti. Controllali prima di salvare.';
      }else{ msg.className='aa-status-msg err'; msg.textContent='Non sono riuscito a estrarre dati dal link.'; }
    }catch(err){ msg.className='aa-status-msg err'; msg.textContent='Errore: '+err.message; }
    finally{ btn.disabled=false; }
  }

  // ---------------- PDF ----------------
  function loadScriptOnce(src){
    return new Promise((resolve,reject)=>{
      const existing = document.querySelector(`script[data-src="${src}"]`);
      if(existing){ if(existing.dataset.loaded==='1') resolve(); else { existing.addEventListener('load',resolve); existing.addEventListener('error',()=>reject(new Error('load-fail'))); } return; }
      const s = document.createElement('script');
      s.src = src; s.dataset.src = src;
      s.onload=()=>{ s.dataset.loaded='1'; resolve(); };
      s.onerror=()=>reject(new Error('load-fail'));
      document.body.appendChild(s);
    });
  }

  async function exportPdf(){
    if(properties.length===0){ alert('Aggiungi almeno un immobile prima di esportare.'); return; }
    const btn = document.getElementById('btnPdf');
    const orig = btn.innerHTML; btn.disabled=true; btn.innerHTML='Generazione PDF...';
    try{
      if(!window.jspdf) await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      if(!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable))
        await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
      const {jsPDF} = window.jspdf;
      const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
      doc.setFont('helvetica','bold'); doc.setFontSize(16);
      doc.text("Riepilogo immobili all'asta", 14, 14);
      doc.setFontSize(9); doc.setFont('helvetica','normal');
      doc.text('Generato il '+new Date().toLocaleDateString('it-IT'), 14, 20);
      const sorted = [...properties].sort((a,b)=>{
        const da=a.dataAsta?new Date(a.dataAsta).getTime():Infinity, db=b.dataAsta?new Date(b.dataAsta).getTime():Infinity;
        return da-db;
      });
      const rows = sorted.map(p=>[
        p.localita||'—', p.riferimento||'—', p.tipologia||'—', p.superficie?p.superficie+' mq':'—', p.efficienza||'—',
        fmtDateTime(p.dataAsta), p.tribunale||'—', p.procedura||'—', p.tipologiaAsta||'—',
        p.prezzoMinimo?'€ '+p.prezzoMinimo:'—', p.offertaPrevista?'€ '+p.offertaPrevista:'—', statusMeta(p.stato).label
      ]);
      doc.autoTable({
        startY:26,
        head:[['Località','Rif.','Tipologia','Superficie','Classe En.','Data Asta','Tribunale','Procedura',"Tipologia d'asta",'Offerta Min.','Tua offerta','Stato']],
        body:rows, styles:{fontSize:7.5, cellPadding:2.2},
        headStyles:{fillColor:[27,37,69], textColor:255, fontStyle:'bold'},
        alternateRowStyles:{fillColor:[246,245,251]}, theme:'grid',
      });
      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='riepilogo-aste-immobiliari.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }catch(err){
      alert('Non sono riuscito a generare il PDF: '+err.message);
    }finally{
      btn.disabled=false; btn.innerHTML=orig;
    }
  }

  // ---------------- BOOT ----------------
  supabase.auth.onAuthStateChange((event, session)=>{
    if(session && session.user){
      currentUser = session.user;
      renderApp();
    }else{
      currentUser = null;
      renderAuth('login');
    }
  });

  supabase.auth.getSession().then(({data})=>{
    if(data.session && data.session.user){ currentUser = data.session.user; renderApp(); }
    else{ renderAuth('login'); }
  });

})();
</script>
